[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentbox"
version = "1.0.0"
description = "Local, hands-off GitHub project agent powered by open-weight models"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6,<3",
  "pyyaml>=6",
  "pathspec>=0.12",
]

[project.scripts]
agentctl = "agentbox.cli:main"

[tool.setuptools.packages.find]
include = ["agentbox*"]

[tool.setuptools.package-data]
agentbox = ["templates/*", "templates/**/*", "web/*", "sandbox_scripts/*"]
