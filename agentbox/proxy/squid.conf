# Egress allowlist proxy for agentbox sandboxes.
# Sandboxes have no direct route to the internet; they can only reach hosts listed in
# allowlist.txt, through this proxy, on ports 80/443.
http_port 3128

acl allowed_sites dstdomain "/etc/squid/allowlist.txt"
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow allowed_sites
http_access deny all

# No caching, no identifying headers.
cache deny all
via off
forwarded_for delete
request_header_access X-Forwarded-For deny all

# Logs go to files inside the container (Squid runs as user `proxy`, which cannot write to
# the container's stdout). Read them with scripts/proxy-log.sh (access) or
# scripts/proxy-log.sh cache (startup/errors). TCP_DENIED lines = blocked requests.
access_log /var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
logfile_rotate 0
pid_filename none
coredump_dir /tmp
shutdown_lifetime 2 seconds
